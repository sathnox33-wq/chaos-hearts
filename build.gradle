plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.version
group = project.group

base {
	archivesName = "chaoshearts"
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Builds the client resource pack zip from /resourcepack into build/resourcepack.
tasks.register('resourcePackZip', Zip) {
	from 'resourcepack'
	archiveFileName = 'chaoshearts-resourcepack.zip'
	destinationDirectory = layout.buildDirectory.dir('resourcepack')
	// Deterministic zip so the SHA-1 only changes when content changes
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

// The mod also embeds the pack so it can host it itself.
processResources {
	dependsOn resourcePackZip
	from(layout.buildDirectory.dir('resourcepack')) {
		into 'chaoshearts_pack'
	}
}
