name: Build

on:
  push:
    branches: [main, datapack-wip]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release for the version in VERSION
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate the datapack functions
        run: |
          set -o pipefail
          python3 tools/build_datapack.py 2>&1 | tee build.log

      - name: Lint the datapack (informational)
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/lint_datapack.py 2>&1 | tee lint.log

      - name: Package the datapack and resource pack
        run: |
          mkdir -p dist
          (cd datapack && zip -qr -X ../dist/chaoshearts-datapack.zip pack.mcmeta data)
          (cd resourcepack && zip -qr -X ../dist/chaoshearts-resourcepack.zip .)
          (cd dist && sha1sum chaoshearts-datapack.zip > chaoshearts-datapack.zip.sha1 && sha1sum chaoshearts-resourcepack.zip > chaoshearts-resourcepack.zip.sha1)
          ls -la dist

      - name: Boot a vanilla 1.21.11 server with the packs and run the bot scenario
        run: bash ci/server-test.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: chaoshearts
          path: dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-logs
          path: ci-server/logs/
          if-no-files-found: ignore

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        run: |
          VERSION=$(cat VERSION)
          TAG="v$VERSION"
          [ "${GITHUB_REF_TYPE}" = tag ] && TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" dist/chaoshearts-datapack.zip dist/chaoshearts-datapack.zip.sha1 \
            dist/chaoshearts-resourcepack.zip dist/chaoshearts-resourcepack.zip.sha1 \
            --target "$GITHUB_SHA" --title "Chaos Hearts $VERSION" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}

      # Keeps a readable copy of the generator output, the lint, the server test and the built files on the
      # ci-output branch, so they can be read without downloading workflow artifacts.
      - name: Save CI output
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/out
          {
            echo "run ${{ github.run_id }} on ${{ github.sha }}: ${{ job.status }}"
            [ -f build.log ] && tail -200 build.log
          } > /tmp/out/build.txt
          [ -f lint.log ] && cp lint.log /tmp/out/lint.txt
          [ -f ci-server/test-summary.txt ] && cp ci-server/test-summary.txt /tmp/out/
          [ -f ci-server/server.log ] && grep -vE '^\s+at |Preparing spawn area' ci-server/server.log | tail -3000 > /tmp/out/server.log
          [ -d dist ] && cp dist/* /tmp/out/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci-output
          git rm -rfq --cached . >/dev/null 2>&1 || true
          git clean -fdxq -e ci-server -e dist >/dev/null 2>&1 || true
          cp /tmp/out/* .
          git add -f -- *.txt *.log *.zip *.sha1 2>/dev/null || true
          git commit -qm "CI output for run ${{ github.run_id }}"
          git push -fq origin ci-output
