name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the mod
        run: |
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build.log

      - name: Collect release files
        run: |
          mkdir -p dist
          cp build/libs/chaoshearts-*[0-9].jar dist/
          cp build/resourcepack/chaoshearts-resourcepack.zip dist/
          (cd dist && sha1sum chaoshearts-resourcepack.zip > chaoshearts-resourcepack.zip.sha1)
          ls -la dist

      - name: Boot a real server with the mod and run the admin commands
        run: bash ci/server-test.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: chaoshearts
          path: dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-logs
          path: ci-server/logs/
          if-no-files-found: ignore

      # Keeps a readable copy of the build result, the server test and the built files on the
      # ci-output branch, so they can be read without downloading workflow artifacts.
      - name: Save CI output
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/out
          {
            echo "run ${{ github.run_id }} on ${{ github.sha }}: ${{ job.status }}"
            if [ -f build.log ]; then grep -E -A4 'error:' build.log | head -900; grep -E 'What went wrong|FAILURE|BUILD' -A3 build.log | head -40; fi
          } > /tmp/out/build.txt
          [ -f ci-server/test-summary.txt ] && cp ci-server/test-summary.txt /tmp/out/
          [ -f ci-server/server.log ] && grep -vE '^\s+at |Preparing spawn area' ci-server/server.log | tail -1500 > /tmp/out/server.log
          [ -d dist ] && cp dist/* /tmp/out/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci-output
          git rm -rfq --cached . >/dev/null 2>&1 || true
          git clean -fdxq -e build -e ci-server -e dist >/dev/null 2>&1 || true
          cp /tmp/out/* .
          git add -f -- *.txt *.log *.jar *.zip *.sha1 2>/dev/null || true
          git commit -qm "CI output for run ${{ github.run_id }}"
          git push -fq origin ci-output

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
