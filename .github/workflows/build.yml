name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the mod
        run: ./gradlew build --stacktrace

      - name: Collect release files
        run: |
          mkdir -p dist
          cp build/libs/chaoshearts-*[0-9].jar dist/
          cp build/resourcepack/chaoshearts-resourcepack.zip dist/
          (cd dist && sha1sum chaoshearts-resourcepack.zip > chaoshearts-resourcepack.zip.sha1)
          ls -la dist

      - name: Boot a real server with the mod and run the admin commands
        run: bash ci/server-test.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: chaoshearts
          path: dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-logs
          path: ci-server/logs/
          if-no-files-found: ignore

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
