name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the mod
        run: |
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build.log

      - name: Collect release files
        run: |
          mkdir -p dist
          cp build/libs/chaoshearts-*[0-9].jar dist/
          cp build/resourcepack/chaoshearts-resourcepack.zip dist/
          (cd dist && sha1sum chaoshearts-resourcepack.zip > chaoshearts-resourcepack.zip.sha1)
          ls -la dist

      - name: Boot a real server with the mod and run the admin commands
        run: bash ci/server-test.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: chaoshearts
          path: dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-logs
          path: ci-server/logs/
          if-no-files-found: ignore

      # Keeps a short, readable copy of any failure on the ci-logs branch.
      - name: Save failure summary
        if: failure() && github.event_name != 'pull_request'
        run: |
          {
            echo "run ${{ github.run_id }} on ${{ github.sha }}"
            [ -f build.log ] && grep -E 'error:|warning: \[|\.java:[0-9]+|What went wrong|FAILURE|BUILD|> ' build.log | grep -v '^\s*at ' | head -400
            [ -f ci-server/server.log ] && { echo '--- server.log ---'; tail -300 ci-server/server.log; }
            [ -f ci-server/test-summary.txt ] && cat ci-server/test-summary.txt
          } > /tmp/summary.txt || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin ci-logs && git checkout ci-logs || git checkout --orphan ci-logs
          git rm -rfq . >/dev/null 2>&1 || true
          cp /tmp/summary.txt latest.txt
          git add latest.txt
          git commit -qm "CI failure summary for ${{ github.run_id }}"
          git push -f origin ci-logs

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
